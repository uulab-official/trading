name: PAPER Atomic Monitor Tick

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor-tick:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Atomic journal and queue integration tests
        run: python -I -S -B -m unittest discover -s tests -p 'test_paper_monitor_tick.py' -v
      - name: Check malformed invocation is nonactivating
        shell: bash
        run: |
          set -euo pipefail
          set +e
          output="$(python -I -S -B tools/paper_monitor_tick.py 2>/dev/null)"
          code="$?"
          set -e
          test "$code" -eq 2
          printf '%s' "$output" | python -c 'import json,sys; j=json.load(sys.stdin); assert j["exit_code"]==2 and not j["boundaries"]["production_ready"]'
