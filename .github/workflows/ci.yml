name: CI/CD Pipeline

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Build and publish container image (never starts trading)'
        type: boolean
        required: true
        default: false
  push:
    branches: [ main, develop ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, develop ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v5.1.0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6.3.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Check Python syntax
      run: |
        python -m compileall -q packages/ apps/server/ tools/

    - name: Cache pip packages
      uses: actions/cache@v5.1.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        # Shutdown tests install the offline CLI without build isolation.
        # Python 3.12 virtualenvs do not bundle its setuptools backend.
        python -m pip install --upgrade pip setuptools wheel
        pip install -e packages/core
        pip install -e packages/data
        pip install -e packages/strategy
        pip install -e packages/backtest
        pip install -e packages/monitor
        pip install -e apps/server
        pip install -r requirements-test.txt

    - name: Test Python package imports and config CLI
      run: |
        python -c "import trading_core; import trading_data; import trading_strategy; print('OK')"
        python -m trading_core.config_cli --help

    - name: Run tests
      run: |
        pytest packages/ apps/server/tests/ -v --cov=trading_core --cov=trading_data --cov=trading_strategy --cov=trading_backtest --cov-report=xml

    - name: Verify network-forbidden offline safety suite
      run: |
        python tools/offline_checks.py

    - name: Preserve coverage report
      uses: actions/upload-artifact@v7.0.2
      with:
        name: coverage-python-${{ matrix.python-version }}-attempt-${{ github.run_attempt }}
        path: ./coverage.xml
        if-no-files-found: error

    - name: Upload coverage
      id: coverage_upload
      if: vars.CODECOV_UPLOAD_ENABLED == 'true'
      # Also handle uploader startup/download failures outside fail_ci_if_error.
      continue-on-error: true
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Warn when coverage upload fails
      if: steps.coverage_upload.outcome == 'failure'
      run: echo "::warning::Codecov upload failed; required tests and coverage generation already passed."

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5.1.0

    - name: Set up Python
      uses: actions/setup-python@v6.3.0
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install -r requirements-lint.txt

    - name: Run flake8
      run: |
        flake8 packages/ apps/ tools/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run black check
      run: |
        black --check packages/ apps/ tools/

    - name: Run isort check
      run: |
        isort --check-only packages/ apps/ tools/

  docker:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
    - uses: actions/checkout@v5.1.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Build Docker image
      run: |
        docker build -f infra/docker/Dockerfile -t trading-bot:latest .

    - name: Test Rust Docker CLI without network access
      run: |
        docker run --rm --network none trading-bot:latest ./trading-server --help
        docker run --rm --network none trading-bot:latest ./trading-server master --help
        docker run --rm --network none trading-bot:latest ./trading-server worker --help
        docker run --rm --network none trading-bot:latest ./trading-server deploy --help
        docker run --rm --network none trading-bot:latest ./trading-server migrate --help

  build-and-push:
    runs-on: ubuntu-latest
    needs: [test, lint, docker]
    if: github.event_name == 'workflow_dispatch' && inputs.publish_image == true
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5.1.0

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4.4.1

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=sha

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./infra/docker/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_VERSION=${{ github.ref_name }}
          BUILD_DATE=${{ github.event.head_commit.timestamp }}

  create-release:
    runs-on: ubuntu-latest
    needs: [test, lint, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5.1.0

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}
        files: |
          LICENSE
          CUSTOMER_SETUP.md
        body: |
          ## Trading research / paper-only release

          This tag **does not approve live automated trading**.
          The Python local paper runner, public quotation snapshot tools,
          and Rust Docker image have distinct state paths. Never assume
          an image tag or dashboard status proves broker readiness.

          ### Safe local check
          ```bash
          python tools/offline_checks.py
          ```

          ### Documentation
          - [Paper-only supervisor](docs/PAPER_SUPERVISOR_RUNBOOK.md)
          - [Production safety gates](PRODUCTION_CHECKLIST.md)
          - [Offline replay](docs/OFFLINE_PAPER_RUNNER.md)

          Live exchange keys, private account permissions, unattended
          real orders, and broker-side reconciliation are **not** included
          or validated by this release.
