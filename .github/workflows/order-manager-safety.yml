name: Order Outcome Safety

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - 'tests/test_order_*.py'
      - 'tests/paper_account_client.test.mjs'
      - 'tests/paper_orders_client.test.mjs'
      - 'apps/dashboard/**'
      - 'tools/paper_session_status.py'
      - '.github/workflows/order-manager-safety.yml'
  push:
    branches: ['feat/smc-market-structure']
    paths:
      - 'packages/core/**'
      - 'tests/test_order_*.py'
      - 'tests/paper_account_client.test.mjs'
      - 'tests/paper_orders_client.test.mjs'
      - 'apps/dashboard/**'
      - 'tools/paper_session_status.py'
      - '.github/workflows/order-manager-safety.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  order-outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install existing engine packages
        run: python -m pip install -e packages/core -e packages/data -e packages/strategy -e apps/server
      - name: Check outcomes, durable state, crash recovery and PaperExchange
        run: python -m unittest discover -s tests -p 'test_order_*.py' -v

  paper-account-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only paper account client
        run: node --test tests/paper_account_client.test.mjs tests/paper_orders_client.test.mjs
