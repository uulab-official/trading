version: '3.8'

services:
  trading-server:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    container_name: trading-server
    restart: unless-stopped
    
    ports:
      - "8080:8080"  # Web dashboard
      - "9000:9000"  # Worker communication
    
    environment:
      - RUST_LOG=info
      - TZ=Asia/Seoul
    
    volumes:
      # Persistent data storage
      - trading-data:/app/data
      # Config override (optional)
      - ../../apps/server/config:/app/config:ro
    
    networks:
      - trading-network
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Health check
    healthcheck:
      test: ["CMD", "./trading-server", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  trading-data:
    driver: local

networks:
  trading-network:
    driver: bridge
