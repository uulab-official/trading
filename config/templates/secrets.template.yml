# Secrets Configuration
# ⚠️  이 파일은 절대 Git에 커밋하지 마세요!
# .gitignore에 반드시 추가하세요.

# ============================================
# EXCHANGE API KEYS
# ============================================
# Binance API
binance:
  api_key: "YOUR_BINANCE_API_KEY_HERE"
  api_secret: "YOUR_BINANCE_API_SECRET_HERE"
  
  # 테스트넷 (선택)
  testnet_api_key: "YOUR_TESTNET_API_KEY_HERE"
  testnet_api_secret: "YOUR_TESTNET_SECRET_HERE"

# Bybit API (선택)
bybit:
  api_key: ""
  api_secret: ""

# OKX API (선택)
okx:
  api_key: ""
  api_secret: ""
  passphrase: ""

# ============================================
# TELEGRAM
# ============================================
telegram:
  bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
  chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"
  
  # 허용된 사용자 ID (보안)
  allowed_user_ids: []

# ============================================
# DATABASE (선택)
# ============================================
database:
  # PostgreSQL 사용 시
  postgres:
    host: "localhost"
    port: 5432
    username: ""
    password: ""
    database: "trading"

# ============================================
# EXTERNAL SERVICES (선택)
# ============================================
# Datadog
Datadog:
  api_key: ""
  app_key: ""

# Splunk
splunk:
  token: ""
  url: ""

# ============================================
# ENCRYPTION (고급 설정)
# ============================================
# 설정 파일 암호화 사용 시
encryption:
  enabled: false
  key_file: "config/.encryption_key"  # 암호화 키 파일 경로
