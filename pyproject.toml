[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-monorepo"
version = "0.1.0"
description = "24/7 Crypto Trading Bot Monorepo"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Trader", email = "trader@example.com"}
]

[tool.setuptools.packages.find]
where = ["packages", "apps"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--disable-plugin-autoload", "-p", "pytest_asyncio.plugin", "-p", "pytest_cov.plugin"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "error:datetime[.]datetime[.](utcnow|utcfromtimestamp):DeprecationWarning",
]

[tool.black]
required-version = "26.10.1"
line-length = 100
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 100
py_version = 310

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
