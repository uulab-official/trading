name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e packages/core
        pip install -e packages/data
        pip install -e packages/strategy
        pip install -e packages/backtest
        pip install -e packages/monitor
        pip install -e apps/trading-bot
        pip install pytest pytest-asyncio pytest-cov

    - name: Run tests
      run: |
        pytest packages/ -v --cov=trading_core --cov=trading_data --cov=trading_strategy --cov=trading_backtest --cov-report=xml

    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install linting tools
      run: |
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 packages/ apps/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Run black check
      run: |
        black --check packages/ apps/ || true

    - name: Run isort check
      run: |
        isort --check-only packages/ apps/ || true

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker image
      run: |
        docker build -f infra/docker/Dockerfile -t trading-bot:latest .

    - name: Test Docker image
      run: |
        docker run --rm trading-bot:latest python -c "import trading_core; import trading_data; import trading_strategy; print('OK')"
