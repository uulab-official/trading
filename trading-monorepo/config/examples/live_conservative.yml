# Example Configuration: Live Trading (실전투자) - Conservative
# 이 설정은 보수적인 리스크 관리로 실전 투자하는 예시입니다.

bot:
  id: "live-conservative-bot"
  name: "Live Trading Bot - Conservative"
  version: "1.0.0"
  mode: live  # live 모드: 실제 거래 실행
  timezone: "Asia/Seoul"

exchange:
  id: binance
  sandbox: false  # 실제 거래소 사용
  default_type: spot
  testnet: false

telegram:
  enabled: true
  notifications:
    trade: true
    error: true
    daily_report: true
    position: true
  commands:
    enabled: true

risk:
  max_daily_loss_pct: 2.0  # 보수적: 일일 최대 2% 손실
  max_daily_trades: 5
  max_position_size_pct: 10.0  # 포지션당 최대 10%
  max_positions: 2  # 동시 최대 2개 포지션
  risk_per_trade_pct: 0.5  # 거래당 0.5% 리스크
  max_leverage: 1.0  # 레버리지 없음 (현물)
  default_stop_loss_pct: 1.5
  default_take_profit_pct: 3.0
  circuit_breaker_loss_pct: 5.0  # 5% 손실 시 서킷브레이커
  cooldown_minutes_after_loss: 120  # 2시간 쿨다운

strategies:
  - name: "BTC_Conservative_RSI"
    enabled: true
    type: rsi
    symbol: "BTC/USDT"
    timeframe: "4h"  # 더 긴 timeframe = 더 안정적
    params:
      period: 14
      oversold: 25  # 더 극단적인 과매도
      overbought: 75  # 더 극단적인 과매수
